name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Next.js static export
        run: |
          rm -f package-lock.json
          npm install --no-package-lock --no-audit --no-fund 2>&1
          echo "--- npm version ---"
          npm --version
          echo "--- node version ---"
          node --version
          echo "--- checking node_modules ---"
          ls node_modules/.bin/ 2>/dev/null || echo "no .bin"
          echo "--- verifying next ---"
          node -e "console.log('next found:', !!require.resolve('next'))"
          echo "--- running build ---"
          npx next build

      - name: Copy web build to Capacitor
        run: npx cap copy

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android

      - name: Build APK (debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kamus-id-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
