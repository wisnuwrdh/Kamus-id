name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Next.js
        run: |
          rm -f package-lock.json
          npm install --no-package-lock --no-audit --no-fund 2>&1
          npx next build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor (add platform + copy + update plugins)
        run: |
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK (debug)
        run: |
          cd android
          chmod +x gradlew
          export GRADLE_USER_HOME="$HOME/.gradle"
          export JAVA_OPTS="-Dhttp.socketTimeout=120000 -Dhttp.connectionTimeout=120000"
          ./gradlew assembleDebug --no-daemon --build-cache -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kamus-id-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
